<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Prediction</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f3f4f6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); text-align: center; }
        h1 { margin-top: 0; color: #111827; }
        .upload-area { border: 2px dashed #d1d5db; border-radius: 8px; padding: 40px; margin: 20px 0; cursor: pointer; transition: background 0.2s; }
        .upload-area:hover { background: #f9fafb; }
        #preview { max-width: 100%; max-height: 300px; margin-top: 20px; display: none; border-radius: 8px; }
        button { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; width: 100%; }
        button:hover { background: #059669; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .loader { display: none; margin: 20px auto; border: 4px solid #f3f3f3; border-top: 4px solid #10b981; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .results { display: none; margin-top: 30px; text-align: left; }
        .images-grid { display: flex; gap: 20px; margin-top: 20px; }
        .images-grid > div { flex: 1; }
        .images-grid img { width: 100%; border-radius: 8px; border: 1px solid #e5e7eb; }
        .summary-box { background: #f8fafc; padding: 16px; border-radius: 8px; margin-top: 20px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<div class="card">
    <h1>🌿 Plant Disease Diagnosis</h1>
    <p>Upload a leaf photo for faithfulness-gated AI diagnosis</p>

    <div class="upload-area" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <p>Click or drag an image here to upload</p>
        <input type="file" id="fileInput" style="display: none;" accept="image/*">
        <img id="preview" src="" alt="Preview">
    </div>

    <button id="predictBtn" disabled>Diagnose</button>
    <div class="loader" id="loader"></div>

    <div class="results" id="results">
        <h2>Diagnosis Complete</h2>
        <div class="summary-box" id="summary"></div>
        <div class="images-grid">
            <div>
                <h4>Predicted Lesion</h4>
                <img id="lesionImg" src="">
            </div>
            <div>
                <h4>Grad-CAM (Attention)</h4>
                <img id="camImg" src="">
            </div>
        </div>
    </div>
</div>

<script>
    let base64Image = "";

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                base64Image = evt.target.result;
                const preview = document.getElementById('preview');
                preview.src = base64Image;
                preview.style.display = 'inline-block';
                document.getElementById('predictBtn').disabled = false;
            }
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('predictBtn').addEventListener('click', async function() {
        if (!base64Image) return;

        this.disabled = true;
        document.getElementById('loader').style.display = 'block';
        document.getElementById('results').style.display = 'none';

        try {
            const response = await fetch('/api/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64Image })
            });
            
            const data = await response.json();
            
            if (!response.ok) {
                alert("Error: " + (data.error || "Failed to process request"));
                return;
            }

            // Render Markdown-like summary (crude parser for basic bolding)
            let summaryHTML = data.summary.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            summaryHTML = summaryHTML.replace(/\n/g, '<br>');
            document.getElementById('summary').innerHTML = summaryHTML;

            if (data.lesion_overlay) document.getElementById('lesionImg').src = data.lesion_overlay;
            if (data.cam_overlay) document.getElementById('camImg').src = data.cam_overlay;
            
            document.getElementById('results').style.display = 'block';
        } catch (e) {
            alert("Error connecting to server");
        } finally {
            this.disabled = false;
            document.getElementById('loader').style.display = 'none';
        }
    });
</script>

</body>
</html>
